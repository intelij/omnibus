# Development services for TransitHub.
# Usage: docker compose up -d mysql redis
# Then point .env at these defaults (see .env.example).
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-transithub}
      MYSQL_USER: ${DB_USERNAME:-transithub}
      MYSQL_PASSWORD: ${DB_PASSWORD:-transithub}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - '${DB_PORT:-3306}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p$${MYSQL_ROOT_PASSWORD}']
      interval: 5s
      timeout: 3s
      retries: 20
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'

volumes:
  mysql_data:
